spring.application.name=Toda
spring.profiles.active=prod

# Trust reverse proxy headers (Coolify/Traefik) so Swagger generates https:// URLs
server.forward-headers-strategy=native
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Toda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=toda
spring.datasource.password=azaneven2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Hibernate dialect auto-detected by Spring Boot (MySQL8Dialect deprecated in Hibernate 6)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Production Logging Levels
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.com.example.Toda=INFO

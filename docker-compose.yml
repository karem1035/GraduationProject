version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: toda-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: Toda
      MYSQL_USER: toda
      MYSQL_PASSWORD: azaneven2004
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - toda-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 40s

  artemis:
    image: apache/activemq-artemis:2.33.0
    container_name: toda-artemis
    restart: unless-stopped
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    volumes:
      - artemis-data:/var/lib/artemis/data
    networks:
      - toda-network

  app:
    build:
      context: ./Toda
      dockerfile: Dockerfile
    container_name: toda-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      artemis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Toda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: toda
      SPRING_DATASOURCE_PASSWORD: azaneven2004
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
      APP_SERVER_BASE_URL: https://asmaa-project.karem.live
    volumes:
      - uploads-data:/app/uploads
    networks:
      - toda-network
    expose:
      - '8080'
    # إلغاء الـ internal healthcheck تماماً وترك الإدارة لـ Coolify
    healthcheck:
      disable: true

volumes:
  mysql-data:
  artemis-data:
  uploads-data:

networks:
  toda-network:
    driver: bridge